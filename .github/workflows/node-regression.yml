name: Delivered HTML regression
on:
  push:
    branches: [main]
    paths: [index.html, 'tests/**', '.github/workflows/node-regression.yml']
  pull_request:
    paths: [index.html, 'tests/**', '.github/workflows/node-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /index.html
            /tests/*.test.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tests/review-regression.test.cjs
