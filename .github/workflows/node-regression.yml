name: Delivered HTML and Chrome regression
on:
  push:
    branches: [main]
    paths: [index.html, 'tests/**', '.github/workflows/node-regression.yml']
  pull_request:
    paths: [index.html, 'tests/**', '.github/workflows/node-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /index.html
            /tests/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tests/review-regression.test.cjs
      - name: Install pinned Playwright and Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/review-qa" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/review-qa/node_modules/playwright/cli.js" install --with-deps chrome
      - name: All delivered Chrome suites
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/review-qa/node_modules/playwright
        run: |
          mkdir -p "$RUNNER_TEMP/review-artifacts/learning" "$RUNNER_TEMP/review-artifacts/integrity"
          P1_RESULT="$RUNNER_TEMP/review-artifacts/learning/results.json" node tests/learning-browser.cjs index.html
          INTEGRITY_RESULT="$RUNNER_TEMP/review-artifacts/integrity/results.json" node tests/data-integrity-browser.cjs index.html
          REVIEW_BROWSER_OUTPUT="$RUNNER_TEMP/review-artifacts/review-scope" node tests/review-scope-browser.cjs index.html
      - name: Preserve Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-browser-evidence
          path: ${{ runner.temp }}/review-artifacts
          if-no-files-found: ignore
